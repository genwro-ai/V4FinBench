model_name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
train_size: 64
test_size: 128
min_positive_ratio_train: 0.10
min_positive_ratio_test: 0.10
seed: 42
target_col: main_label
system_prompt: |-
  You are a bankruptcy prediction model.
  Based on structured company and financial data, predict whether the company will go bankrupt {horizon_description}.
  Respond with only one word: YES or NO.
max_seq_length: 512
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 0.0002
num_train_epochs: 0.01
logging_steps: 1
eval_steps: 10
save_steps: 10
warmup_ratio: 0.03
weight_decay: 0.0
val_split: 0.10
use_bf16: false
use_4bit: false
device_map: auto
optim: adamw_torch
