n_trials: 40
early_stopping_rounds: 200

models:
  logistic_regression:
    search:
      C: {low: 1.0e-4, high: 10.0, log: true}

  xgboost:
    search:
      learning_rate: {low: 0.01, high: 0.1, log: true}
      max_depth: {low: 2, high: 8}
      min_child_weight: {low: 1.0, high: 100.0, log: true}
      subsample: {low: 0.5, high: 1.0}
      colsample_bytree: {low: 0.3, high: 1.0}
      reg_lambda: {low: 1.0e-3, high: 100.0, log: true}

  lightgbm:
    search:
      learning_rate: {low: 0.01, high: 0.1, log: true}
      num_leaves: {low: 4, high: 128, log: true}
      min_child_samples: {low: 10, high: 500, log: true}
      subsample: {low: 0.5, high: 1.0}
      colsample_bytree: {low: 0.3, high: 1.0}
      reg_lambda: {low: 1.0e-3, high: 100.0, log: true}

  catboost:
    search:
      learning_rate: {low: 0.01, high: 0.1, log: true}
      depth: {low: 2, high: 8}
      l2_leaf_reg: {low: 1.0, high: 100.0, log: true}
      rsm: {low: 0.3, high: 1.0}
      bagging_temperature: {low: 0.0, high: 1.0}

  realmlp:
    params:
      val_metric_name: cross_entropy
      use_ls: false
      batch_size: 1024
    search:
      num_emb_type: {choices: [none, pbld, pl, plr]}
      add_front_scale: {choices: [true, false]}
      lr: {low: 0.02, high: 0.3, log: true}
      p_drop: {choices: [0.0, 0.15, 0.3]}
      wd: {choices: [0.0, 0.02]}
      plr_sigma: {low: 0.05, high: 0.5, log: true}
      act: {choices: [relu, selu, mish]}
      hidden_sizes: {choices: [[256, 256, 256], [64, 64, 64, 64, 64], [512]]}

  tabm:
    params:
      val_metric_name: cross_entropy
      batch_size: 1024
