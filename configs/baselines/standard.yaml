models:
  logistic_regression:
    C: [0.001, 0.01, 0.1, 1.0]
    penalty: l2
  mlp:
    hidden_layer_sizes:
      - [64, 64]
      - [128, 128]
      - [256, 256]
    alpha: [0.0001, 0.001]
    learning_rate_init: [0.001, 0.01]
  random_forest:
    n_estimators: [100, 300]
    max_depth: [5, 10, null]
  xgboost:
    n_estimators: [100, 200]
    max_depth: [3, 5, 7]
    learning_rate: [0.05, 0.1, 0.2]
  catboost:
    iterations: [100, 200]
    depth: [4, 6, 8]
    learning_rate: [0.01, 0.05, 0.1]
  lightgbm:
    n_estimators: [100, 200]
    max_depth: [-1, 5, 10]
    learning_rate: [0.05, 0.1, 0.2]

